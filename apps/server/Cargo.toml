[package]
name = "personal-monitoring"
version = "0.1.0"
edition = "2021"

[lib]
name = "personal_monitoring"
path = "src/lib.rs"

[[bin]]
name = "personal-monitoring"
path = "src/main.rs"

[features]
default = ["asio"]
# ASIO bypasses the Windows audio stack entirely and is the only Windows backend where
# BufferSize::Fixed actually shrinks the callback period, which is what capture latency is.
# It needs LLVM/Clang at build time (cpal's build script runs bindgen over the ASIO SDK and
# downloads the SDK itself). Build with `--no-default-features` on a machine without Clang.
asio = ["cpal/asio"]

[dependencies]
cpal = "0.18"
ctrlc = "3.4"
futures-util = "0.3"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
