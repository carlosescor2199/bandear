  <style>

      --bg: #192223;
      --bg-deep: #0f1416;
      --surface-2: #253233;
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #f1f4f3;
      --text-muted: #a9b7b6;
      --accent: #ffbf43;
      --accent-ink: #1a1405;
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(60% 50% at 50% 20%, rgba(255, 191, 67, 0.10), transparent 70%),
        linear-gradient(180deg, var(--bg-deep), var(--bg) 85%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
      text-align: center;
    }
    main {
      max-width: 34rem;
    }
    svg {
      width: 112px;
      height: 112px;
      filter: drop-shadow(0 0 18px rgba(255, 191, 67, 0.4));
    }
    .code {
      margin: 20px 0 8px;
      font: 600 0.875rem ui-monospace, "Cascadia Code", Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      line-height: 1.15;
    }
    p {
      margin: 0 0 28px;
      color: var(--text-muted);
      font-size: 1.0625rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
    }
    a.btn:hover {
      border-color: var(--accent);
    }
    a.btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    <div class="actions">
      <a class="btn btn-primary" href="/bandear/" data-home data-text="home">Back to BandEar</a>

  <script>
    // Home is /bandear/ on carlosescor2199.github.io and / on a custom domain.
    (function () {
      var home = /\.github\.io$/.test(location.hostname) ? "/bandear/" : "/";
      document.querySelector("[data-home]").setAttribute("href", home);

      // Same language choice as the main page (js/i18n.js): stored choice, else the browser.
      var lang = "en";
      try {
        var stored = localStorage.getItem("bandear.lang");
        if (stored === "es" || stored === "en") lang = stored;
        else if (/^es/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "")) lang = "es";
      } catch (error) {
        if (/^es/i.test(navigator.language || "")) lang = "es";
      }
      if (lang !== "es") return;
      var es = {
        title: "Esta página no está en la mezcla",
        body: "Puede que el enlace sea antiguo o tenga un error. Todo sobre BandEar está a un clic.",
        home: "Volver a BandEar",
        download: "Descargar",
      };
      document.documentElement.lang = "es";
      document.title = "Página no encontrada · BandEar";
      var nodes = document.querySelectorAll("[data-text]");
      for (var i = 0; i < nodes.length; i++) nodes[i].textContent = es[nodes[i].getAttribute("data-text")];
    })();
  </script>
